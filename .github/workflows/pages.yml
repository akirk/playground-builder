name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Build static site
        run: php scripts/build-static.php
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test library
        run: npm install --prefix "$RUNNER_TEMP/playground-builder-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.65.1
      - name: Test generated links through the real browser UI
        env:
          NODE_PATH: ${{ runner.temp }}/playground-builder-browser/node_modules
        run: node --test tests/share-links.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/static

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
